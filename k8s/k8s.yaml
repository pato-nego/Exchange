apiVersion: v1
kind: ConfigMap
metadata:
  name: exchange-config
data:
  CACHE_SECONDS: '300'
  RETRY_SECONDS: '30'
  PTAX_TIMEOUT: '3'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exchange
spec:
  selector:
    matchLabels:
      app: exchange
  template:
    metadata:
      labels:
        app: exchange
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload: exchange
      tolerations:
      - key: workload
        operator: Equal
        value: exchange
        effect: NoSchedule
      containers:
      - name: exchange
        image: pato-nego/exchange:local
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: exchange-config
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            memory: 192Mi
        startupProbe:
          httpGet:
            path: /exchange/health-check
            port: http
          timeoutSeconds: 3
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /exchange/health-check
            port: http
          timeoutSeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /exchange/health-check
            port: http
          timeoutSeconds: 3
          periodSeconds: 15
  replicas: 1
---
apiVersion: v1
kind: Service
metadata:
  name: exchange
spec:
  type: ClusterIP
  selector:
    app: exchange
  ports:
  - name: http
    port: 8000
    targetPort: http
